<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Interactive Grade 7 Mathematics module — Quadrilaterals from Triangles and Polygons. Learn through story, simulation and practice!"/>
<title>Quadrilaterals — Grade 7 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg-dark:#0a0a2e;--bg-card:rgba(30,30,100,.7);--bg-card-solid:#1a1a5e;
  --purple-deep:#2d1b69;--purple-mid:#4a2c8a;--purple-light:#7c5cbf;
  --blue-deep:#1a237e;--blue-mid:#283593;--blue-bright:#3f51b5;
  --gold:#ffc107;--gold-light:#ffd54f;--gold-dark:#f9a825;
  --green:#4caf50;--green-light:#81c784;--red:#ef5350;--coral:#ff7043;
  --white:#fff;--text-primary:#fff;--text-secondary:rgba(255,255,255,.7);--text-muted:rgba(255,255,255,.4);
  --font-display:'Fredoka',sans-serif;--font-body:'Nunito',sans-serif;
  --radius-sm:8px;--radius-md:16px;--radius-lg:24px;--radius-xl:32px;--radius-full:9999px;
  --shadow-card:0 8px 32px rgba(0,0,0,.35);--shadow-btn:0 4px 15px rgba(0,0,0,.3);
  --t:.3s cubic-bezier(.4,0,.2,1);
}
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:var(--font-body);color:var(--text-primary);background:linear-gradient(135deg,var(--bg-dark) 0%,var(--purple-deep) 40%,#1a0a3e 70%,#0d1b3e 100%) fixed;overflow-x:hidden}
body{-webkit-font-smoothing:antialiased}

/* FLOATING BG */
.fl-wrap{pointer-events:none;z-index:0;position:fixed;inset:0;overflow:hidden}
.fl-item{color:rgba(255,255,255,.05);user-select:none;font-weight:700;animation:floatUp2 linear infinite;position:absolute}
@keyframes floatUp2{0%{opacity:0;transform:translateY(110vh) rotate(0)}10%{opacity:.07}90%{opacity:.07}100%{opacity:0;transform:translateY(-80px) rotate(360deg)}}

/* LAYOUT */
.app{z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;min-height:100%;position:relative}

/* JOURNEY BAR */
.journey-bar{z-index:90;backdrop-filter:blur(15px);border-radius:0 0 var(--radius-lg) var(--radius-lg);background:rgba(10,10,46,.88);border:1px solid rgba(255,255,255,.08);border-top:none;align-items:center;gap:0;padding:10px 20px;display:flex;position:fixed;top:0;left:50%;transform:translateX(-50%)}
.jstep{align-items:center;gap:5px;display:flex}
.jdot{width:28px;height:28px;color:var(--text-muted);transition:var(--t);background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:50%;justify-content:center;align-items:center;font-size:.65rem;font-weight:700;display:flex}
.jstep.active .jdot{background:var(--gold);border-color:var(--gold);color:#1a1a2e;box-shadow:0 0 12px rgba(255,193,7,.4)}
.jstep.done .jdot{background:var(--green);border-color:var(--green);color:#fff}
.jlabel{color:var(--text-muted);white-space:nowrap;font-size:.68rem;font-weight:600}
.jstep.active .jlabel{color:var(--gold)}
.jstep.done .jlabel{color:var(--green-light)}
.jconn{background:rgba(255,255,255,.15);width:18px;height:2px;margin:0 3px}
.jconn.done{background:var(--green)}

/* HOME & AUDIO BTNS */
.home-btn{z-index:100;border-radius:var(--radius-full);backdrop-filter:blur(10px);color:var(--text-primary);font-family:var(--font-body);cursor:pointer;transition:var(--t);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);align-items:center;gap:8px;padding:8px 16px;font-size:.9rem;font-weight:600;display:flex;position:fixed;top:16px;left:16px}
.home-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.05)}
.audio-btn{z-index:200;backdrop-filter:blur(10px);cursor:pointer;width:44px;height:44px;transition:var(--t);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:50%;justify-content:center;align-items:center;font-size:1.4rem;display:flex;position:fixed;top:16px;right:16px;user-select:none;}
.audio-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}

/* CARDS & BUTTONS */
.glass-card{background:var(--bg-card);backdrop-filter:blur(20px);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);border:1px solid rgba(255,255,255,.1);padding:32px}
.btn{border-radius:var(--radius-md);font-family:var(--font-display);cursor:pointer;transition:var(--t);box-shadow:var(--shadow-btn);border:none;justify-content:center;align-items:center;gap:10px;min-width:140px;padding:14px 28px;font-size:1.05rem;font-weight:600;display:inline-flex}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.4)}
.btn:active{transform:translateY(0)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#1a1a2e}
.btn-green{color:#fff;background:linear-gradient(135deg,#4caf50,#2e7d32)}
.btn-violet{color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.btn-outline{color:var(--text-primary);background:transparent;border:2px solid rgba(255,255,255,.3)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{min-width:auto;padding:9px 18px;font-size:.88rem}
.btn-lg{padding:18px 44px;font-size:1.25rem}

/* MASCOT */
.mascot{background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:50%;justify-content:center;align-items:center;box-shadow:0 4px 20px rgba(255,193,7,.3);flex-shrink:0;display:flex}
.mascot.lg{width:80px;height:80px;font-size:2.2rem}
.mascot.md{width:60px;height:60px;font-size:1.7rem}
.mascot.sm{width:48px;height:48px;font-size:1.3rem}
.mascot.happy{animation:celebrate .6s}
.mascot.think{animation:wobble 1s infinite}
.speech-bubble{color:#333;background:#fff;border-radius:14px;padding:10px 16px;font-size:.9rem;font-weight:600;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.12);max-width:200px}
.speech-bubble::before{content:'';border:6px solid transparent;border-right-color:#fff;position:absolute;top:50%;left:-10px;transform:translateY(-50%)}
.mascot-row{display:flex;align-items:center;gap:14px;justify-content:center;margin:14px 0}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:680px;padding:10px 0;margin-bottom:8px}
.hud-chip{border-radius:var(--radius-full);background:rgba(255,255,255,.08);align-items:center;gap:6px;padding:6px 14px;font-size:.95rem;font-weight:700;display:flex}

/* QUESTION CARD */
.qcard{backdrop-filter:blur(20px);border-radius:var(--radius-lg);text-align:center;background:rgba(20,20,80,.65);border:1px solid rgba(255,255,255,.1);width:100%;max-width:680px;padding:28px;position:relative}
.qtext{font-family:var(--font-display);margin:14px 0 22px;font-size:1.28rem;font-weight:500;line-height:1.6}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px}
.opt-btn{border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-display);cursor:pointer;transition:var(--t);text-align:center;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);padding:14px;font-size:1.1rem;font-weight:600;line-height:1.3}
.opt-btn:hover:not(.dis){border-color:var(--gold);background:rgba(255,193,7,.1);transform:scale(1.02)}
.opt-btn.correct{border-color:var(--green)!important;background:rgba(76,175,80,.2)!important;animation:cpulse .5s}
.opt-btn.wrong{border-color:var(--red)!important;background:rgba(239,83,80,.2)!important;animation:shake .4s}
.opt-btn.dis{pointer-events:none;opacity:.6}
.hint-line{color:var(--gold-light);display:flex;justify-content:center;align-items:center;gap:6px;margin-top:8px;font-size:.88rem;font-style:italic}

/* FEEDBACK OVERLAY */
.fb-overlay{z-index:500;backdrop-filter:blur(4px);background:rgba(0,0,0,.65);display:flex;justify-content:center;align-items:center;animation:fadeIn .2s;position:fixed;inset:0}
.fb-box{text-align:center;border-radius:var(--radius-xl);max-width:360px;padding:36px 40px;animation:bounceIn .4s;width:90%}
.fb-box.ok{background:linear-gradient(135deg,rgba(76,175,80,.92),rgba(46,125,50,.92))}
.fb-box.no{background:linear-gradient(135deg,rgba(239,83,80,.92),rgba(198,40,40,.92))}
.fb-emoji{font-size:3.8rem;margin-bottom:10px}
.fb-title{font-family:var(--font-display);font-size:1.5rem;font-weight:600;margin-bottom:6px}
.fb-sub{color:rgba(255,255,255,.88);font-size:.92rem;line-height:1.5}

/* XP POP */
.xp-pop{z-index:600;border-radius:var(--radius-full);background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#1a1a2e;font-family:var(--font-display);padding:9px 18px;font-size:1.05rem;font-weight:700;animation:floatUp 1.5s forwards;position:fixed;top:80px;right:28px;box-shadow:0 4px 15px rgba(255,193,7,.4);pointer-events:none}

/* PROGRESS DOTS */
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
.dot{width:11px;height:11px;transition:var(--t);background:rgba(255,255,255,.2);border-radius:50%}
.dot.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.dot.done{background:var(--green)}

/* PROGRESS BAR */
.pbar-wrap{width:100%;max-width:680px;margin-bottom:8px}
.pbar-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-muted);margin-bottom:4px}
.pbar-track{height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--purple-light),var(--gold));border-radius:999px;transition:width .5s}

/* ==================== INTRO ==================== */
.intro-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:10px;text-align:center}
.intro-badge{backdrop-filter:blur(10px);border-radius:var(--radius-full);background:rgba(255,255,255,.1);padding:7px 22px;font-size:.83rem;font-weight:600}
.intro-h1{font-family:var(--font-display);font-size:clamp(2rem,5.5vw,3.6rem);font-weight:700;line-height:1.15}
.intro-sub{color:var(--text-secondary);max-width:720px;font-size:1.3rem;font-weight:500;line-height:1.6}
.journey-strip{border-radius:var(--radius-lg);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);width:100%;max-width:860px;padding:18px 24px;margin-top:10px}
.jmap-title{font-family:var(--font-display);color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;font-size:1.35rem}
.jmap-steps{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.jmap-step{display:flex;align-items:center;gap:8px}
.jmap-icon{background:rgba(255,255,255,.08);border-radius:50%;width:42px;height:42px;font-size:1.7rem;display:flex;justify-content:center;align-items:center}
.jmap-label{font-family:var(--font-display);font-size:1.1rem;font-weight:600;text-align:left}
.jmap-desc{color:var(--text-muted);font-size:.85rem}
.jmap-arrow{color:var(--text-muted);font-size:1.1rem;margin:0 6px}
.feat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:18px}
.feat-card{backdrop-filter:blur(10px);border-radius:var(--radius-md);text-align:center;min-width:130px;transition:var(--t);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:18px 24px}
.feat-card:hover{background:rgba(255,255,255,.13);transform:translateY(-4px)}
.feat-icon{font-size:1.9rem;margin-bottom:7px}
.feat-label{color:var(--text-secondary);font-size:.82rem;font-weight:600}

/* ==================== WONDER ==================== */
.wonder-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:80px 24px 40px;gap:22px}
.wonder-ball{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:50%;width:110px;height:110px;display:flex;justify-content:center;align-items:center;position:relative;transform:scale(0);transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.wonder-ball.show{transform:scale(1)}
.wonder-glow{background:radial-gradient(circle,rgba(99,102,241,.3),transparent 70%);border-radius:50%;animation:pulse 2s infinite;position:absolute;inset:-10px}
.wonder-qmark{font-family:var(--font-display);color:#fff;font-size:3.5rem;font-weight:700}
.wonder-card{backdrop-filter:blur(20px);border-radius:var(--radius-xl);opacity:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);padding:28px 26px;transition:all .6s .5s;transform:translateY(28px);max-width:580px;text-align:center}
.wonder-card.show{opacity:1;transform:translateY(0)}
.wonder-emoji{font-size:2.8rem;margin-bottom:10px}
.wonder-qtext{font-family:var(--font-display);font-size:1.35rem;font-weight:600;line-height:1.5;margin-bottom:10px}
.wonder-sub{color:var(--text-secondary);font-size:.92rem;font-style:italic}
.wonder-btn-wrap{opacity:0;transform:translateY(18px);transition:all .5s .9s}
.wonder-btn-wrap.show{opacity:1;transform:translateY(0)}

/* ==================== STORY ==================== */
.story-wrap{display:flex;flex-direction:column;align-items:center;width:100%;min-height:100vh;padding:76px 20px 56px;gap:18px}
.story-pbar-row{display:flex;align-items:center;gap:12px;width:100%;max-width:680px}
.story-pbar-track{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.story-pbar-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,var(--gold));border-radius:999px;transition:width .5s}
.story-card{background:var(--bg-card);backdrop-filter:blur(20px);border-radius:var(--radius-xl);width:100%;max-width:1060px;box-shadow:var(--shadow-card);transition:opacity .3s,transform .3s;border:1px solid rgba(255,255,255,.1);padding:32px}
.story-card.flip{opacity:.4;transform:scale(.97)}
.story-flex{display:flex;flex-flow:row;gap:32px;align-items:flex-start}
.story-img-col{flex:1.5;min-width:0;border-radius:14px;overflow:hidden;min-height:340px;display:flex;align-items:flex-start}
.story-img{width:100%;height:auto;object-fit:cover;border-radius:14px;display:block}
.story-txt-col{flex:1;min-width:0;display:flex;flex-direction:column;padding:4px 0}
.story-ptitle{font-family:var(--font-display);color:var(--gold);font-size:1.45rem;font-weight:600;margin-bottom:12px}
.story-body{color:var(--text-secondary);font-size:1.13rem;line-height:1.85;font-weight:700;opacity:0;transform:translateY(10px);transition:all .5s}
.story-body.show{opacity:1;transform:translateY(0)}
.story-hl{border-radius:var(--radius-md);background:rgba(255,193,7,.1);border:1px solid rgba(255,193,7,.3);padding:11px 18px;margin:14px 0;display:flex;align-items:center;gap:8px;opacity:0;transform:scale(.92);transition:all .4s .3s}
.story-hl.show{opacity:1;transform:scale(1)}
.story-hl-text{font-family:var(--font-display);color:var(--gold);font-size:1.1rem;font-weight:600}
.story-nav-row{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1060px}
.story-dots{display:flex;gap:8px}
.sdot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);transition:var(--t);cursor:pointer}
.sdot.on{background:var(--gold);box-shadow:0 0 8px rgba(255,193,7,.4)}
.sdot.done{background:var(--green)}

/* ==================== SIMULATE ==================== */
.sim-wrap{display:flex;flex-direction:column;align-items:center;width:100%;min-height:100vh;padding:76px 20px 44px}
.sim-hdr{text-align:center;margin-bottom:14px}
.sim-label{font-family:var(--font-display);color:var(--gold);font-size:1.05rem;margin-bottom:3px}
.sim-sub{color:var(--text-muted);font-size:.82rem}
.station-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.stab{font-family:var(--font-display);font-size:.82rem;font-weight:600;padding:8px 16px;border-radius:var(--radius-full);border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--text-muted);cursor:pointer;transition:var(--t)}
.stab.on{border-color:var(--gold);background:rgba(255,193,7,.15);color:var(--gold)}
.stab.done{border-color:var(--green);background:rgba(76,175,80,.15);color:var(--green-light)}
.scard{background:var(--bg-card);backdrop-filter:blur(20px);border-radius:var(--radius-xl);border:1px solid rgba(255,255,255,.1);padding:28px;width:100%;max-width:780px;box-shadow:var(--shadow-card)}
.scard-title{font-family:var(--font-display);font-size:1.55rem;font-weight:700;color:var(--gold);margin-bottom:3px}
.scard-sub{color:var(--text-muted);font-size:.88rem;margin-bottom:16px}
.instr{background:rgba(255,255,255,.05);border-radius:var(--radius-md);padding:11px 15px;margin-bottom:18px;font-size:.93rem;color:var(--text-secondary);border-left:3px solid var(--gold)}
.sim-canvas{width:100%;border-radius:var(--radius-md);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);padding:16px}
.sbtn{font-family:var(--font-display);font-size:.95rem;font-weight:600;padding:11px 22px;border-radius:var(--radius-full);border:none;cursor:pointer;transition:var(--t);margin:5px}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sbtn-g{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#1a1a2e}
.sbtn-s{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.adisplay{font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--gold);text-align:center;padding:10px}
.formula-box{font-family:var(--font-display);font-size:1.5rem;font-weight:700;text-align:center;padding:14px;background:rgba(255,193,7,.1);border-radius:var(--radius-md);border:1px solid rgba(255,193,7,.2);margin:10px 0}
.round-info{text-align:center;color:var(--text-muted);font-size:.82rem;margin-top:6px}
.poly-slider{width:100%;accent-color:var(--gold);margin:10px 0;cursor:pointer;height:20px}
/* Shape Sorter - Enhanced 7th Grade Edition */
.shape-deck{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;perspective:800px}
.family-tree{display:flex;flex-direction:column;align-items:center;margin-top:24px;position:relative}
.ftrow{display:flex;justify-content:center;gap:20px;position:relative;z-index:2;width:100%}
.tree-connector{display:flex;justify-content:center;margin:8px 0;opacity:0.6}
.sdeck-card{background:linear-gradient(135deg,rgba(30,30,80,.8),rgba(20,20,60,.9));border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-md);padding:14px;text-align:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.sdeck-card::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transition:0s}
.sdeck-card:hover:not(.sdp){transform:translateY(-4px);border-color:var(--gold);box-shadow:0 8px 20px rgba(255,193,7,.2)}
.sdeck-card:hover:not(.sdp)::after{left:100%;transition:left .6s}
.sdeck-card.sds{border:2px solid var(--gold);background:rgba(255,193,7,.15);transform:scale(1.05);box-shadow:0 0 15px rgba(255,193,7,.4)}
.sdeck-card.sdp{opacity:.4;filter:grayscale(1);cursor:default;transform:scale(.95)}
.sdeck-icon{font-size:2.4rem;margin-bottom:6px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.sdeck-nm{font-family:var(--font-display);font-size:.9rem;font-weight:700;color:var(--text-primary)}
.ftcard{background:rgba(15,15,40,.7);backdrop-filter:blur(10px);border:2px dashed rgba(255,255,255,.2);border-radius:var(--radius-lg);padding:14px;text-align:center;transition:all .4s;min-width:140px;position:relative;z-index:2;cursor:pointer}
.ftcard:hover{border-color:rgba(255,255,255,.5);background:rgba(30,30,80,.8)}
.ft-target{border-color:var(--gold);background:rgba(255,193,7,.1);border-style:solid;box-shadow:0 0 20px rgba(255,193,7,.2)}
.glowPulse{animation:gpulse 1.5s infinite}
@keyframes gpulse{0%{box-shadow:0 0 10px rgba(255,193,7,.2)}50%{box-shadow:0 0 25px rgba(255,193,7,.6)}100%{box-shadow:0 0 10px rgba(255,193,7,.2)}}
.ft-placed{border-style:solid;border-color:var(--green);background:rgba(76,175,80,.1);box-shadow:0 0 15px rgba(76,175,80,.2)}
.ft-icon{font-size:1.8rem;margin-bottom:4px}
.ft-name{font-family:var(--font-display);font-size:1.05rem;font-weight:700;color:var(--text-primary)}
.ft-hint{font-size:.78rem;color:var(--text-muted);margin-top:4px}
.ft-check{font-family:var(--font-display);font-size:.85rem;color:var(--green-light);font-weight:700;margin-top:8px;animation:popIn .4s}

<script>
'use strict';
// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
const S = {
  phase:'intro', audioOn:true, xp:0, streak:0, badges:[],
  stDone:[false,false,false,false,false],   // 5 stations
  wResults:Array(8).fill(null),
  totalQ:0, totalOk:0,
  activeW:null, wQIdx:0, wAnswers:[], curQ:null,
  hints:0, attempts:0, storyP:0, reflectStep:0,
  usedTypes:[]
};

const PHASES=['intro','wonder','story','simulate','play','reflect'];
const PLABELS=['Welcome','Wonder','Story','Simulate','Practice','Reflect'];
const PICONS=['🏠','🤔','📖','🔬','🏆','🌟'];

// ─────────────────────────────────────────
// FLOATING BACKGROUND
// ─────────────────────────────────────────
(function(){
  const shapes=['◆','▲','⬟','⬡','⬢','◇','▷','□','△','⬠'];
  const c=document.getElementById('fl');
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='fl-item';
    d.textContent=shapes[i%shapes.length];
    d.style.left=Math.random()*100+'vw';
    d.style.fontSize=(1.2+Math.random()*2.8)+'rem';
    d.style.animationDuration=(14+Math.random()*16)+'s';
    d.style.animationDelay=-(Math.random()*25)+'s';
    c.appendChild(d);
  }
})();

// ─────────────────────────────────────────
// AUDIO (Web Audio API tones)
// ─────────────────────────────────────────
let actx=null;
function gac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function tone(f,t='sine',d=.18,v=.14){
  if(!S.audioOn)return;
  try{const c=gac(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(v,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
    o.start();o.stop(c.currentTime+d);}catch(e){}
}
let currentAudio = null;
function playVoice(id) {
    if (!S.audioOn) return;
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    currentAudio = new Audio('audio/' + id + '.mp3');
    currentAudio.play().catch(e => console.log('Audio play failed:', e));
}
function sndOk(){tone(880,'sine',.14,.2);setTimeout(()=>tone(1100,'sine',.14,.2),130);}
function sndWrong(){tone(200,'sawtooth',.28,.15); playVoice('feedback_wrong');}
function sndClick(){tone(660,'sine',.07,.1);}
function sndBadge(){[440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.2,.18),i*110));}
function sndTap(){tone(750,'sine',.06,.08);}

// ─────────────────────────────────────────
// CONFETTI
// ─────────────────────────────────────────
function confetti(n=60){

// HELPERS
// ─────────────────────────────────────────
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function distractors(c,mn,mx,ct=3){
  const d=new Set(),offs=shuffle([-30,-20,-15,-10,-5,5,10,15,20,30]);
  for(const o of offs){const v=c+o;if(v>=mn&&v<=mx&&v!==c&&!d.has(v))d.add(v);if(d.size>=ct)break;}
  while(d.size<ct){const v=rnd(mn,mx);if(v!==c)d.add(v);}
  return shuffle([c,...d]).slice(0,4);
}

  }

}

function drawShapeSVG(sd, inv){
  const col = sd.color;
  // angle mark squares
  const angleSquareSize = 12;
  const angleMarks = (sd.allRight ? sd.angleMarks : []).map(([x,y])=>{
    // determine offset direction per corner based on position relative to center (130,130)
    const dx = x < 130 ? 1 : -1;
    const dy = y < 130 ? 1 : -1;
    const ax = dx>0 ? x : x - angleSquareSize;
    const ay = dy>0 ? y : y - angleSquareSize;
    return `<rect x="${ax}" y="${ay}" width="${angleSquareSize}" height="${angleSquareSize}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".7"/>`;
  }).join('');
  // parallel side arrows
  let parallelArrows = '';
  if(sd.parallelPairs >= 1){
    // top side arrow
    parallelArrows += `<path d="M 100,78 L 118,78 M 112,72 L 118,78 L 112,84" stroke="${col}" stroke-width="2" fill="none" opacity=".8"/>`;
    parallelArrows += `<path d="M 95,182 L 113,182 M 107,176 L 113,182 L 107,188" stroke="${col}" stroke-width="2" fill="none" opacity=".8"/>`;
  }
  if(sd.parallelPairs >= 2){
    parallelArrows += `<path d="M 48,110 L 48,128 M 42,122 L 48,128 L 54,122" stroke="#818cf8" stroke-width="2" fill="none" opacity=".8"/>`;
    parallelArrows += `<path d="M 208,110 L 208,128 M 202,122 L 208,128 L 214,122" stroke="#818cf8" stroke-width="2" fill="none" opacity=".8"/>`;
  }
  const diagSvg = inv.showDiag ? `<path d="${sd.diag}" stroke="#4caf50" stroke-width="2" stroke-dasharray="6,3" fill="none" opacity=".85"/>` : '';
  return `<svg width="260" height="260" viewBox="0 0 260 260" style="max-width:100%;display:block;margin:0 auto">
    <defs>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path d="${sd.svgPath}" fill="${col}22" stroke="${col}" stroke-width="3" filter="url(#glow)"/>

    ${parallelArrows}
    ${diagSvg}
    <text x="130" y="240" fill="${col}" font-family="Fredoka" font-size="14" font-weight="700" text-anchor="middle">${sd.name}</text>
  </svg>`;
}

  </div>
  <div class="sim-canvas">
    <svg width="270" height="230" viewBox="0 0 270 230" style="max-width:100%;display:block;margin:0 auto">${polysvg(n,simSt.polyTri)}</svg>
    <div class="formula-box">(${n} − 2) × 180° = <span style="color:var(--green)">${sum}°</span>${simSt.polyTri?` ✓ (${n-2} triangles)`:''}</div>
    <div style="color:var(--text-secondary);font-size:.88rem;text-align:center">Each interior angle (regular): <strong style="color:var(--gold)">${each}°</strong></div>
  </div>
  <div style="text-align:center;margin-top:10px">
    <button class="sbtn sbtn-g" onclick="doTriC()">${simSt.polyTri?'✅ Triangulated!':'🔺 Fan Triangulate'}</button>
    <button class="sbtn sbtn-s" onclick="resetC()">🔄 Reset</button>
  </div>
  ${simSt.polyTri?`<div style="text-align:center;margin-top:10px"><button class="sbtn sbtn-g" onclick="doneStn(2)">✅ Got it! Next Station →</button></div>`:''}`;
}
function polysvg(n,tri){
  const cx=135,cy=115,r=94,pts=[];
  for(let i=0;i<n;i++){const a=(i/n)*2*Math.PI-Math.PI/2;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
  const ps=pts.map(p=>p.join(',')).join(' ');
  let s=`<polygon points="${ps}" fill="rgba(99,102,241,.18)" stroke="#8b5cf6" stroke-width="2"/>`;
  if(tri){
    const cols=['rgba(255,193,7,.28)','rgba(76,175,80,.28)','rgba(239,83,80,.26)','rgba(41,182,246,.26)','rgba(255,112,67,.26)','rgba(171,71,188,.26)','rgba(255,238,88,.26)','rgba(102,187,106,.26)'];
    for(let i=1;i<n-1;i++){
      const p0=pts[0],p1=pts[i],p2=pts[i+1];
      s+=`<polygon points="${p0},${p1},${p2}" fill="${cols[(i-1)%cols.length]}" stroke="#4caf50" stroke-width="1.5"/>`;
      s+=`<line x1="${p0[0]}" y1="${p0[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="5,3"/>`;
    }
  }
  return s;
}

function chgN(v){simSt.polyN=parseInt(v);simSt.polyTri=false;sndTap();render();}

const WORLDS=[

  {id:1,name:'Athens Column Court',icon:'🏛️',desc:'Exterior angles',col:'#ab47bc',types:[2],diff:'Easy'},

const NAMES=['John','Mike','Sarah','Priya','Yuki','Omar','Carlos','Fatima','Wei','Liam','Aisha','Elena','Diego','Mei','Kwame','Sofia','Hassan','Noah','Olivia','Arjun','Lucas','Emma'];
const OBJECTS=['kite frame','garden trellis','skateboard ramp','roof truss','stop sign','floor tile','picture frame','solar panel','drone wing','treehouse window','mosaic tile','bridge truss','umbrella panel','sail panel'];
const PNAMES={5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon',9:'nonagon',10:'decagon',11:'hendecagon',12:'dodecagon'};

/* Question generators — 10 types, all procedural, no repeats */
function genQ(type){
  switch(type){
    case 1:{// missing triangle angle
      const a=rnd(30,80),b=rnd(30,80),c=180-a-b;
      return{text:`A triangle has angles ${a}° and ${b}°. What is the third angle?`,opts:distractors(c,10,140),cor:c,hint:'Triangle angles sum to 180°.',ex:`180° − ${a}° − ${b}° = ${c}°.`};}
    case 2:{// exterior angle
      const r1=rnd(30,70),r2=rnd(30,70),ext=r1+r2;
      return{text:`An exterior angle of a triangle has remote interior angles ${r1}° and ${r2}°. Find the exterior angle.`,opts:distractors(ext,50,160),cor:ext,hint:'Exterior angle = sum of the two remote interior angles.',ex:`${r1}° + ${r2}° = ${ext}°.`};}
    case 3:{// quadrilateral missing angle
      const a=rnd(70,110),b=rnd(70,110),c=rnd(60,110),d=360-a-b-c;
      if(d<30||d>170)return genQ(3);
      return{text:`A quadrilateral has angles ${a}°, ${b}°, and ${c}°. Find the fourth angle.`,opts:distractors(d,20,170),cor:d,hint:'Quadrilateral angles sum to 360°.',ex:`360° − ${a}° − ${b}° − ${c}° = ${d}°.`};}
    case 4:{// polygon angle sum
      const n=rnd(5,12),sum=(n-2)*180;
      return{text:`Find the sum of interior angles of a ${PNAMES[n]||n+'-gon'} (${n} sides).`,opts:distractors(sum,180,1800),cor:sum,hint:'Use (n − 2) × 180°.',ex:`(${n} − 2) × 180° = ${n-2} × 180° = ${sum}°.`};}
    case 5:{// sides from sum
      const n=rnd(5,10),sum=(n-2)*180;
      return{text:`A polygon's interior angles sum to ${sum}°. How many sides does it have?`,opts:distractors(n,3,14),cor:n,hint:`Rearrange (n − 2) × 180° = ${sum}°.`,ex:`${sum} ÷ 180 + 2 = ${n}.`};}
    case 6:{// regular polygon each angle
      const n=rnd(5,10),each=Math.round(((n-2)*180)/n);
      return{text:`Find each interior angle of a regular ${PNAMES[n]||n+'-gon'}.`,opts:distractors(each,60,170),cor:each,hint:'[(n − 2) × 180°] ÷ n',ex:`[(${n}−2)×180] ÷ ${n} = ${each}°.`};}
    case 7:{// diagonals
      const n=rnd(5,10),d=n*(n-3)/2;
      return{text:`How many diagonals does a ${PNAMES[n]||n+'-gon'} (${n} sides) have?`,opts:distractors(d,0,35),cor:d,hint:'n(n − 3) ÷ 2',ex:`${n}×${n-3}÷2 = ${d}.`};}
    case 8:{// word problem
      const nm=pick(NAMES),ob=pick(OBJECTS),a=rnd(35,75),b=rnd(35,75),c=180-a-b;
      return{text:`${nm} is building a ${ob} shaped like a triangle. Two angles measure ${a}° and ${b}°. What is the third angle?`,opts:distractors(c,10,140),cor:c,hint:'Triangle angle sum = 180°.',ex:`180° − ${a}° − ${b}° = ${c}°.`};}
    case 9:{// classification
      const cls=[
        {q:'has all four sides equal but no right angles',a:'Rhombus'},
        {q:'has all right angles and opposite sides equal',a:'Rectangle'},
        {q:'has all sides equal AND all right angles',a:'Square'},
        {q:'has two pairs of adjacent equal sides',a:'Kite'},
        {q:'has two pairs of parallel sides',a:'Parallelogram'},
        {q:'has exactly one pair of parallel sides',a:'Trapezoid'},
      ];
      const s=pick(cls);
      const wr=shuffle(cls.filter(x=>x.a!==s.a)).slice(0,3).map(x=>x.a);
      return{text:`A quadrilateral that ${s.q}. What type is it?`,opts:shuffle([s.a,...wr]),cor:s.a,hint:'Think about parallel sides, equal sides, and right angles.',ex:`A shape that ${s.q} is a ${s.a}.`};}
    case 10:{// true/false
      const stmts=[
        {t:'The exterior angles of any convex polygon always sum to 360°.',c:'True',e:'Yes! Always 360° for any n.'},
        {t:'A square is a type of rectangle.',c:'True',e:'A square has right angles and equal opposite sides — it is a rectangle.'},
        {t:'A rectangle is always a rhombus.',c:'False',e:'A rectangle\'s sides are not necessarily all equal.'},
        {t:`The interior angles of a hexagon sum to 720°.`,c:'True',e:'(6−2)×180° = 720°. ✓'},
        {t:`The interior angles of a pentagon sum to 900°.`,c:'False',e:'(5−2)×180° = 540°, not 900°.'},
        {t:'A parallelogram always has all right angles.',c:'False',e:'Only a rectangle (a special parallelogram) has right angles.'},
        {t:'All quadrilaterals have an angle sum of 360°.',c:'True',e:'2 triangles × 180° = 360° for any quadrilateral.'},
        {t:'A kite has two pairs of parallel sides.',c:'False',e:'A kite has two pairs of adjacent equal sides, NOT parallel.'},
        {t:'The diagonal count of a hexagon is 9.',c:'True',e:'6×(6−3)÷2 = 9.'},
        {t:'A rhombus is always a square.',c:'False',e:'A rhombus has equal sides but not necessarily right angles.'},
      ];
      const s=pick(stmts);
      return{text:s.t,opts:shuffle(['True','False',`${rnd(180,720)}°`,'Cannot determine']).slice(0,4).map(x=>(x===s.c?x:x)),cor:s.c,hint:'Think carefully about definitions.',ex:s.e};}
    default:return genQ(1);
  }
}

function nextQ(wid){
  const types=WORLDS[wid].types;
  // Avoid repeating last 2 types
  const recent=S.usedTypes.slice(-2);
  const avail=types.filter(t=>!recent.includes(t));
  const t=pick(avail.length?avail:types);
  S.usedTypes.push(t); if(S.usedTypes.length>20)S.usedTypes.shift();
  return genQ(t);
}
function stars(sc){return sc>=9?3:sc>=7?2:sc>=5?1:0;}

function renderPlay(){
  if(S.activeW!==null&&S.wQIdx<10)return renderQ();
  if(S.activeW!==null&&S.wQIdx>=10)return renderWDone();
  return renderMap();
}

function ans(chosen,btn){
  sndTap();
  const q=S.curQ; S.attempts++;
  const ok=String(chosen)===String(q.cor);
  document.querySelectorAll('.opt-btn').forEach(b=>b.classList.add('dis'));
  btn.classList.add(ok?'correct':'wrong');
  if(ok){
    sndOk();
    const xp=S.attempts===1?10:S.hints>0?5:7;
    const sb=S.streak>=4?5:0, tot=xp+sb;
    S.xp+=tot; S.streak++; S.totalOk++; S.wAnswers.push(true);
    xpPop(tot); showFB(true,q.ex,tot);
  } else {
    sndWrong(); S.streak=0;
    if(S.attempts>=2){
      document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent.trim()===String(q.cor))b.classList.add('correct');});
      S.wAnswers.push(false); showFB(false,q.ex,0);
    }
  }
}

    if(S.streak>=10)checkBadge('diagonal_streak');

    checkBadge('polygon_pro');

}

const RQUES=[

  {q:"What is the interior angle sum of a pentagon (5 sides)?",opts:[
    {t:'(5 − 2) × 180° = 540°',ok:true},
    {t:'5 × 180° = 900°',ok:false},
    {t:'(5 + 2) × 180° = 1260°',ok:false},
    {t:'360°',ok:false},
  ]},
  {q:"Which statement about quadrilateral families is TRUE?",opts:[
